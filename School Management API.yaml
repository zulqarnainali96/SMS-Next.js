      - updated_at
      - user
    StudentCreate:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          default: default123
        first_name:
          type: string
        last_name:
          type: string
        admission_number:
          type: string
        school_id:
          type: string
          format: uuid
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        parent_name:
          type: string
        parent_phone:
          type: string
      required:
      - admission_number
      - school_id
      - username
    Subject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 20
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    Teacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        employee_id:
          type: string
          maxLength: 50
        subject_specialization:
          type: string
          maxLength: 200
        date_joined:
          type: string
          format: date
          nullable: true
        school:
          type: string
          format: uuid
      required:
      - created_at
      - employee_id
      - id
      - school
      - updated_at
      - user
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        school:
          type: string
          format: uuid
          nullable: true
        phone:
          type: string
          maxLength: 15
      required:
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
